name: Build Safari16Enhance

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # roothide REQUIRES the roothide theos fork; upstream theos does not
      # know the roothide package scheme.
      - name: Setup Theos (roothide)
        run: |
          git clone --recurse-submodules https://github.com/roothide/theos.git ${{ runner.temp }}/theos
          find ${{ runner.temp }}/theos/bin -name "*.pl" -exec sed -i '' '1s|#!/usr/bin/perl|#!/usr/bin/env perl|' {} \;
          echo "THEOS=${{ runner.temp }}/theos" >> $GITHUB_ENV
          echo "THEOS_PACKAGE_SCHEME=roothide" >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          export HOMEBREW_NO_REQUIRE_TAP_TRUST=1
          brew install dpkg ldid

      - name: Install SDK
        run: |
          cd ${{ runner.temp }}/theos/sdks
          curl -sLO https://github.com/theos/sdks/archive/refs/heads/master.zip
          unzip -q master.zip
          mv sdks-master/iPhoneOS16.5.sdk .
          rm -rf sdks-master master.zip

      - name: Verify source discipline
        run: |
          # Only %ctor / %hook-style directives allowed here is %ctor (entry).
          if grep -nE '^[[:space:]]*%(hook|ctor|orig|log|new|end|group)' Tweak.xm | grep -v '%ctor'; then
            echo "::error::Tweak.xm must stay pure objc/runtime apart from %ctor"
            exit 1
          fi
          grep -q 'com.apple.mobilesafari' Safari16Enhance.plist
          grep -q 'SFDialogView' Tweak.xm
          grep -q 'DISPATCH_QUEUE_SERIAL' Tweak.xm
          echo "OK: source discipline present"

      - name: Verify control file
        run: |
          python3 - <<'PY'
          import re, sys
          raw = open('control', 'rb').read().decode('utf-8').replace('\r\n', '\n')
          lines = [l for l in raw.split('\n') if l.strip()]
          fields, order = {}, []
          for l in lines:
              if ': ' in l or l.endswith(':'):
                  k = l.split(':', 1)[0]
                  if not re.fullmatch(r'[A-Za-z][A-Za-z0-9-]*', k):
                      print(f"::error::control 行不是合法字段: {l[:80]}")
                      sys.exit(1)
                  fields[k] = l.split(':', 1)[1].strip()
                  order.append(k)
              else:
                  print(f"::error::control 出现孤立续行（多半是说明文字粘到了上一行字段）: {l[:80]}")
                  sys.exit(1)
          for req in ['Package','Name','Version','Architecture','Description','Maintainer','Author','Section','Depends']:
              if req not in fields or not fields[req]:
                  print(f"::error::control 缺少字段或为空: {req}")
                  sys.exit(1)
          # Depends 只能是 ASCII 包名表达式 —— 中文说明混进来会让 dpkg 直接拒装整个包
          dep = fields['Depends']
          if not re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9+._\-]*(, ?[A-Za-z0-9][A-Za-z0-9+._\-]*)*', dep):
              print(f"::error::Depends 字段含非法字符（dpkg 会拒绝安装）: {dep[:120]}")
              sys.exit(1)
          # Description 必须是单行（本包一直用单行长描述）
          if 'Description' not in order:
              print("::error::Description 字段缺失")
              sys.exit(1)
          print(f"OK: control 字段齐全，Depends = {dep}")
          PY

      - name: Build (with diagnostics)
        run: make package

      - name: Verify build contents
        run: |
          DYLIB=$(find .theos -name 'Safari16Enhance.dylib' -type f -not -path '*.dSYM*' | head -1)
          if [ -z "$DYLIB" ] || [ ! -f "$DYLIB" ]; then
            echo "::error::Safari16Enhance.dylib not found"
            exit 1
          fi
          echo "== $DYLIB =="
          otool -L "$DYLIB"
          STRINGS=$(strings -a "$DYLIB")
          VER=$(grep '^Version:' control | awk '{print $2}')
          for NEEDLE in \
            "Safari16Enhance $VER loaded" \
            'Safari16Enhance.log' \
            'SFDialogView' \
            'SFDialogController' \
            'appLinkRedirect' \
            'killOpenInApp' \
            'killAppLinkPrompt' \
            'AppLinkWithURL' \
            'killSmartBanner' \
            'didFinishNavigation' \
            'killURLBarSwipe' \
            'didMoveToWindow' \
            'Documents' ; do
            if ! echo "$STRINGS" | grep -qF "$NEEDLE"; then
              echo "::error::required string missing from dylib: $NEEDLE"
              exit 1
            fi
          done
          echo "OK: engine + alert + in-container log path all present"
          # 中文关键词可能被 clang 以 UTF-16 形式放进 __ustring，字符串工具抓不到，
          # 这里直接扫原始字节，两种编码都认。
          DYLIB="$DYLIB" python3 - <<'PY'
          import os, sys
          data = open(os.environ["DYLIB"], "rb").read()
          ok = True
          for kw in ["打不开该网页", "无法打开该网页", "网址无效", "App 内打开"]:
              u8  = kw.encode("utf-8") in data
              u16 = kw.encode("utf-16-le") in data
              print(f"{kw}  utf8={u8} utf16le={u16}")
              if not (u8 or u16):
                  ok = False
          sys.exit(0 if ok else 1)
          PY
          echo "OK: chinese alert keywords embedded"
          echo "== deb =="
          ls -l packages/

      - name: Save and upload diagnostic deb
        run: |
          mkdir -p artifacts
          cp packages/*.deb artifacts/Safari16Enhance-0.13.4-withlog.deb
          ls -l artifacts/

      - name: Upload diagnostic deb
        uses: actions/upload-artifact@v4
        with:
          name: Safari16Enhance-roothide-withlog
          path: artifacts/Safari16Enhance-0.13.4-withlog.deb
          if-no-files-found: error

      - name: Build no-log variant
        run: |
          rm -f packages/*.deb
          make clean
          cp control control.bak
          sed -i '' 's/^Version: 0.13.4$/Version: 0.13.4-nolog/' control
          SPEH_NO_LOG=1 make package
          cp control.bak control
          cp packages/*.deb artifacts/Safari16Enhance-0.13.4-nolog.deb
          ls -l artifacts/

      - name: Verify no-log variant
        run: |
          DYLIB=$(find .theos -name 'Safari16Enhance.dylib' -type f -not -path '*.dSYM*' | head -1)
          echo "== no-log dylib: $DYLIB =="
          STRINGS=$(strings -a "$DYLIB")
          if echo "$STRINGS" | grep -q 'Safari16Enhance.log'; then
            echo "::error::no-log build still contains log path string"
            exit 1
          fi
          if echo "$STRINGS" | grep -q 'com.huhansibuxin.speh.log'; then
            echo "::error::no-log build still contains log queue string"
            exit 1
          fi
          for NEEDLE in 'SFDialogController' 'appLinkRedirect' 'killOpenInApp' \
                        'killAppLinkPrompt' 'AppLinkWithURL' 'killSmartBanner' \
                        'didFinishNavigation' 'killURLBarSwipe' 'didMoveToWindow'; do
            if ! echo "$STRINGS" | grep -qF "$NEEDLE"; then
              echo "::error::no-log build missing functional string: $NEEDLE"
              exit 1
            fi
          done
          echo "OK: log fully stripped, all functional hooks present"

      - name: Upload no-log deb
        uses: actions/upload-artifact@v4
        with:
          name: Safari16Enhance-roothide-nolog
          path: artifacts/Safari16Enhance-0.13.4-nolog.deb
          if-no-files-found: error
