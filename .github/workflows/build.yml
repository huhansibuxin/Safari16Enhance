name: Build Safari16Enhance

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # roothide REQUIRES the roothide theos fork; upstream theos does not
      # know the roothide package scheme.
      - name: Setup Theos (roothide)
        run: |
          git clone --recurse-submodules https://github.com/roothide/theos.git ${{ runner.temp }}/theos
          find ${{ runner.temp }}/theos/bin -name "*.pl" -exec sed -i '' '1s|#!/usr/bin/perl|#!/usr/bin/env perl|' {} \;
          echo "THEOS=${{ runner.temp }}/theos" >> $GITHUB_ENV
          echo "THEOS_PACKAGE_SCHEME=roothide" >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          export HOMEBREW_NO_REQUIRE_TAP_TRUST=1
          brew install dpkg ldid

      - name: Install SDK
        run: |
          cd ${{ runner.temp }}/theos/sdks
          curl -sLO https://github.com/theos/sdks/archive/refs/heads/master.zip
          unzip -q master.zip
          mv sdks-master/iPhoneOS16.5.sdk .
          rm -rf sdks-master master.zip

      - name: Verify source discipline
        run: |
          # Only %ctor / %hook-style directives allowed here is %ctor (entry).
          if grep -nE '^[[:space:]]*%(hook|ctor|orig|log|new|end|group)' Tweak.xm | grep -v '%ctor'; then
            echo "::error::Tweak.xm must stay pure objc/runtime apart from %ctor"
            exit 1
          fi
          grep -q 'com.apple.mobilesafari' Safari16Enhance.plist
          grep -q 'SFDialogView' Tweak.xm
          grep -q 'DISPATCH_QUEUE_SERIAL' Tweak.xm
          echo "OK: source discipline present"

      - name: Build
        run: make package

      - name: Verify build contents
        run: |
          DYLIB=$(find .theos -name 'Safari16Enhance.dylib' -type f -not -path '*.dSYM*' | head -1)
          if [ -z "$DYLIB" ] || [ ! -f "$DYLIB" ]; then
            echo "::error::Safari16Enhance.dylib not found"
            exit 1
          fi
          echo "== $DYLIB =="
          otool -L "$DYLIB"
          STRINGS=$(strings -a "$DYLIB")
          VER=$(grep '^Version:' control | awk '{print $2}')
          for NEEDLE in \
            "Safari16Enhance $VER loaded" \
            'Safari16Enhance.log' \
            'SFDialogView' \
            'killOpenInApp' \
            'killAppLinkPrompt' \
            'AppLinkWithURL' \
            'killSmartBanner' \
            'didFinishNavigation' \
            'killURLBarSwipe' \
            'didMoveToWindow' \
            '明细已省略' \
            'Documents' ; do
            if ! echo "$STRINGS" | grep -qF "$NEEDLE"; then
              echo "::error::required string missing from dylib: $NEEDLE"
              exit 1
            fi
          done
          echo "OK: engine + alert + in-container log path all present"
          # 中文关键词可能被 clang 以 UTF-16 形式放进 __ustring，字符串工具抓不到，
          # 这里直接扫原始字节，两种编码都认。
          DYLIB="$DYLIB" python3 - <<'PY'
          import os, sys
          data = open(os.environ["DYLIB"], "rb").read()
          ok = True
          for kw in ["打不开该网页", "无法打开该网页", "网址无效", "App 内打开"]:
              u8  = kw.encode("utf-8") in data
              u16 = kw.encode("utf-16-le") in data
              print(f"{kw}  utf8={u8} utf16le={u16}")
              if not (u8 or u16):
                  ok = False
          sys.exit(0 if ok else 1)
          PY
          echo "OK: chinese alert keywords embedded"
          echo "== deb =="
          ls -l packages/

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: Safari16Enhance-roothide
          path: packages/*.deb
